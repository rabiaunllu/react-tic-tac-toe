<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XO TACTIX - Fixed Square (Title Top, Safe Zone Compliant)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Orbitron:wght@700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 800px;
      height: 800px;
      overflow: hidden;
      background: #080d1a;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 24px 24px;
    }

    /* Outer dark border frame */
    .outer-frame {
      position: absolute;
      inset: 14px;
      border: 2.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle grid lines */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Ambient glows */
    .glow-top {
      position: absolute;
      top: -80px;
      right: 50px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
    }

    .glow-bottom {
      position: absolute;
      bottom: -80px;
      left: 0px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.15) 0%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
    }

    /* TOP HEADER:
       Top-left (0..250, 0..210) is 100% CLEAR for CrazyGames 'NEW'/'HOT' badge.
       Title 'XO TACTIX' is aligned on the RIGHT side of the top! */
    .top-header {
      width: 100%;
      height: 170px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding-right: 20px;
      z-index: 5;
    }

    .title-row {
      font-family: 'Fredoka', 'Orbitron', sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .title-x {
      color: #00f0ff;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.8), 0 0 50px rgba(0, 240, 255, 0.4);
    }

    .title-o {
      color: #ff2d75;
      text-shadow: 0 0 25px rgba(255, 45, 117, 0.8), 0 0 50px rgba(255, 45, 117, 0.4);
      margin-right: 10px;
    }

    .title-tactix {
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.4));
      letter-spacing: 0.06em;
    }

    .subtitle-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* CENTER BOARD (Top sits safely at y > 240px, below the 210px red badge box!) */
    .center-board {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 5px;
    }

    .board-wrapper {
      position: relative;
      transform: rotate(3.2deg);
    }

    .board-container {
      width: 460px;
      height: 460px;
      background: rgba(16, 24, 40, 0.75);
      border: 3px solid rgba(0, 240, 255, 0.28);
      border-radius: 36px;
      padding: 16px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 45px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      position: relative;
    }

    .grid-cell {
      position: relative;
      background: rgba(22, 32, 54, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .grid-cell.cell-2x {
      border: 2px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
    }

    .cell-2x-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      z-index: 5;
    }

    /* Perfect Centered Marks */
    .mark-x {
      font-family: 'Fredoka', sans-serif;
      font-size: 94px;
      font-weight: 700;
      color: #00f0ff;
      line-height: 1;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .mark-o {
      font-family: 'Fredoka', sans-serif;
      font-size: 94px;
      font-weight: 700;
      color: #ff2d75;
      line-height: 1;
      text-shadow: 0 0 25px rgba(255, 45, 117, 0.9), 0 0 50px rgba(255, 45, 117, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .laser-beam-line {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 550px;
      height: 6px;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.2) 0%, #fbbf24 30%, #fffbeb 50%, #fbbf24 70%, rgba(251, 191, 36, 0.2) 100%);
      box-shadow: 0 0 20px #fbbf24, 0 0 35px rgba(251, 191, 36, 0.7);
      transform: translate(-50%, -50%) rotate(-45deg);
      border-radius: 999px;
      z-index: 8;
      pointer-events: none;
    }

    .laser-star-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .laser-star-svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 25px #fbbf24);
    }

    /* BOTTOM BAR */
    .bottom-tags-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.16em;
      color: #94a3b8;
      text-transform: uppercase;
      z-index: 2;
      margin-bottom: 6px;
    }

    .diamond-cyan {
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
    }
    .diamond-pink {
      color: #ff2d75;
      text-shadow: 0 0 8px #ff2d75;
    }

    /* Bottom gradient accent line */
    .bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #00f0ff 0%, #a855f7 50%, #ff2d75 100%);
      box-shadow: 0 -2px 15px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="outer-frame"></div>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>
  <div class="bottom-accent-bar"></div>

  <!-- TOP HEADER (Title stays at TOP, shifted right to completely avoid top-left badge!) -->
  <div class="top-header">
    <div class="title-row">
      <span class="title-x">X</span><span class="title-o">O</span>
      <span class="title-tactix">TACTIX</span>
    </div>

    <div class="subtitle-badge">
      POWER TIC-TAC-TOE
    </div>
  </div>

  <!-- CENTER BOARD (Top sits safely below y=210px) -->
  <div class="center-board">
    <div class="board-wrapper">
      <div class="board-container">
        <div class="laser-beam-line"></div>
        <div class="laser-star-center">
          <svg class="laser-star-svg" viewBox="0 0 100 100">
            <polygon points="50,0 58,42 100,50 58,58 50,100 42,58 0,50 42,42" fill="#ffffff" />
            <polygon points="50,22 55,45 78,50 55,55 50,78 45,55 22,50 45,45" fill="#fef08a" />
            <circle cx="50" cy="50" r="7" fill="#ffffff" />
          </svg>
        </div>

        <!-- ROW 0 -->
        <div class="grid-cell">
          <div class="mark-x">X</div>
        </div>
        <div class="grid-cell"></div>
        <div class="grid-cell">
          <div class="mark-o">O</div>
        </div>

        <!-- ROW 1 -->
        <div class="grid-cell"></div>
        <div class="grid-cell cell-2x">
          <span class="cell-2x-badge">2x</span>
          <div class="mark-x">X</div>
        </div>
        <div class="grid-cell"></div>

        <!-- ROW 2 -->
        <div class="grid-cell">
          <div class="mark-o">O</div>
        </div>
        <div class="grid-cell"></div>
        <div class="grid-cell">
          <div class="mark-x">X</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-tags-row">
    <span>OUTPLAY</span>
    <span class="diamond-cyan">◆</span>
    <span>OVERPOWER</span>
    <span class="diamond-pink">◆</span>
    <span>REVENGE</span>
  </div>
</body>
</html>
