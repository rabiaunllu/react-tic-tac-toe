<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XO TACTIX - Landscape Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 65% 50%, #0d1527 0%, #070a14 55%, #03050a 100%);
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Subtle cybernetic blueprint grid */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Ambient glow orbs in corners */
    .glow-cyan {
      position: absolute;
      top: 15%;
      left: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .glow-magenta {
      position: absolute;
      bottom: 10%;
      right: 15%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 45, 117, 0.12) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .cover-container {
      position: relative;
      z-index: 2;
      width: 1720px;
      height: 940px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 90px;
    }

    /* LEFT COLUMN: BRANDING & POWER DECK */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 96px;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1;
      display: flex;
      gap: 22px;
      text-transform: uppercase;
    }

    .brand-title .x-part {
      color: #00f0ff;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.8), 0 0 50px rgba(0, 240, 255, 0.4);
    }
    .brand-title .o-part {
      color: #ff2d75;
      text-shadow: 0 0 25px rgba(255, 45, 117, 0.8), 0 0 50px rgba(255, 45, 117, 0.4);
    }

    .brand-subtitle {
      font-size: 24px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }

    .chips-row {
      display: flex;
      gap: 12px;
    }

    .chip {
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 45, 117, 0.14);
      border: 1px solid rgba(255, 45, 117, 0.35);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip.cyan {
      background: rgba(0, 240, 255, 0.12);
      border-color: rgba(0, 240, 255, 0.35);
      color: #7dd3fc;
    }

    /* Player Card UI from the actual game */
    .player-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #00f0ff;
      border-radius: 28px;
      padding: 30px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .player-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .symbol-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: rgba(0, 240, 255, 0.18);
      border: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .player-name {
      font-size: 28px;
      font-weight: 800;
      color: #f8fafc;
    }

    .timer-badge {
      padding: 6px 14px;
      border-radius: 10px;
      background: rgba(14, 165, 233, 0.2);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      font-family: 'Orbitron', monospace;
      font-size: 17px;
      font-weight: 800;
    }

    .score-block {
      text-align: right;
    }
    .score-label {
      font-size: 13px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .score-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .turn-prompt {
      font-size: 17px;
      font-weight: 600;
      color: #94a3b8;
    }

    .powers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .power-btn {
      position: relative;
      height: 96px;
      background: rgba(30, 41, 59, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .power-btn.active-power {
      border-color: #00f0ff;
      background: rgba(14, 165, 233, 0.2);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
    }

    .power-btn .icon-wrap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .power-btn .power-name {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .power-btn .count-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      color: #090d16;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }


    /* RIGHT COLUMN: TACTICAL BATTLE BOARD */
    .right-col {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-frame {
      position: relative;
      width: 660px;
      height: 660px;
      background: #0d1527;
      border: 3px solid rgba(0, 240, 255, 0.35);
      border-radius: 40px;
      padding: 30px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(0, 240, 255, 0.2);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 20px;
    }

    /* Board Top Neon Bar */
    .board-top-glow {
      position: absolute;
      top: -3px;
      left: 20%;
      right: 20%;
      height: 4px;
      background: #00f0ff;
      box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
      border-radius: 2px;
    }

    .cell {
      position: relative;
      background: #182238;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 100px;
      font-weight: 900;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.05), 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .cell.x-cell {
      color: #00f0ff;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.9), 0 0 60px rgba(0, 240, 255, 0.5);
    }

    .cell.o-cell {
      color: #ff2d75;
      text-shadow: 0 0 30px rgba(255, 45, 117, 0.9), 0 0 60px rgba(255, 45, 117, 0.5);
    }

    .cell.frozen-cell {
      border: 2px solid #38bdf8;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, #15243f 80%);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
    }

    .multiplier-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      padding: 5px 12px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.22);
      border: 1.5px solid #f59e0b;
      color: #fef08a;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    /* Laser Win Beam across the middle column */
    .laser-beam {
      position: absolute;
      left: 50%;
      top: 30px;
      bottom: 30px;
      width: 8px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ff2d75 0%, #00f0ff 100%);
      box-shadow: 0 0 18px #00f0ff, 0 0 35px #ff2d75;
      border-radius: 999px;
      z-index: 10;
      pointer-events: none;
    }

    .shield-aura {
      position: absolute;
      inset: 6px;
      border-radius: 20px;
      border: 2px dashed rgba(0, 240, 255, 0.8);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4) inset, 0 0 25px rgba(0, 240, 255, 0.4);
      pointer-events: none;
    }
    .shield-tag {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #38bdf8;
      background: rgba(14, 165, 233, 0.3);
      padding: 3px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="glow-cyan"></div>
  <div class="glow-magenta"></div>

  <div class="cover-container">
    <!-- LEFT: BRAND & UI DECK -->
    <div class="left-col">
      <div>
        <div class="brand-title">
          <span class="x-part">XO</span>
          <span class="o-part">TACTIX</span>
        </div>
        <p class="brand-subtitle">Place your mark. Unleash powers. Claim revenge.</p>
      </div>

      <div class="chips-row">
        <span class="chip">ARENA</span>
        <span class="chip">30 POINTS</span>
        <span class="chip cyan">3x3</span>
        <span class="chip cyan">3 IN-A-ROW</span>
      </div>

      <!-- Real Player Card -->
      <div class="player-card">
        <div class="player-card-header">
          <div class="player-info">
            <div class="symbol-badge">X</div>
            <span class="player-name">Player 1</span>
            <span class="timer-badge">12s</span>
          </div>
          <div class="score-block">
            <div class="score-label">POINTS</div>
            <div class="score-value">20</div>
          </div>
        </div>

        <p class="turn-prompt">Your turn. Choose a power or place a mark.</p>

        <div class="powers-grid">
          <!-- BOMB -->
          <div class="power-btn">
            <span class="count-badge">1</span>
            <div class="icon-wrap">
              <svg viewBox="0 0 140 160" width="34" height="34">
                <radialGradient id="bBody" cx="38%" cy="38%" r="65%">
                  <stop offset="0%" stopColor="#475569" />
                  <stop offset="35%" stopColor="#1e293b" />
                  <stop offset="85%" stopColor="#0f172a" />
                  <stop offset="100%" stopColor="#020617" />
                </radialGradient>
                <circle cx="70" cy="98" r="44" fill="url(#bBody)" stroke="#a855f7" stroke-width="3" />
                <circle cx="56" cy="84" r="10" fill="#ffffff" opacity="0.4" />
                <path d="M 70,54 L 70,36" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
                <circle cx="70" cy="34" r="6" fill="#ef4444" />
              </svg>
            </div>
            <span class="power-name">Bomb</span>
          </div>

          <!-- SHIELD -->
          <div class="power-btn active-power">
            <span class="count-badge">1</span>
            <div class="icon-wrap">
              <svg viewBox="0 0 100 120" width="30" height="36">
                <linearGradient id="sCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#67e8f9" />
                  <stop offset="50%" stopColor="#06b6d4" />
                  <stop offset="100%" stopColor="#0e7490" />
                </linearGradient>
                <path d="M 50 6 C 78 6, 94 14, 94 28 C 94 72, 68 104, 50 114 C 32 104, 6 72, 6 28 C 6 14, 22 6, 50 6 Z" fill="url(#sCyan)" stroke="#cffafe" stroke-width="4" />
              </svg>
            </div>
            <span class="power-name">Shield</span>
          </div>

          <!-- FREEZE -->
          <div class="power-btn">
            <span class="count-badge">1</span>
            <div class="icon-wrap">
              <svg viewBox="0 0 200 200" width="34" height="34">
                <circle cx="100" cy="100" r="80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 6" />
                <path d="M 100 20 L 100 180 M 20 100 L 180 100 M 43 43 L 157 157 M 43 157 L 157 43" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" />
                <circle cx="100" cy="100" r="14" fill="#ffffff" />
              </svg>
            </div>
            <span class="power-name">Freeze</span>
          </div>

          <!-- VAMPIRE -->
          <div class="power-btn">
            <span class="count-badge">1</span>
            <div class="icon-wrap" style="font-size: 30px;">
              🧛
            </div>
            <span class="power-name">Vampire</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: THE REAL TACTICAL BOARD -->
    <div class="right-col">
      <div class="board-frame">
        <div class="board-top-glow"></div>
        <div class="laser-beam"></div>

        <!-- ROW 1 -->
        <div class="cell x-cell">
          <span class="multiplier-badge">2x</span>
          X
        </div>
        <div class="cell x-cell">
          X
        </div>
        <div class="cell o-cell">
          <span class="multiplier-badge" style="border-color:#f59e0b; color:#fde047;">3x</span>
          O
        </div>

        <!-- ROW 2 -->
        <!-- FREEZE CELL -->
        <div class="cell frozen-cell">
          <svg viewBox="0 0 200 200" width="110" height="110">
            <linearGradient id="iceCenter" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#ffffff" />
              <stop offset="50%" stopColor="#67e8f9" />
              <stop offset="100%" stopColor="#0284c7" />
            </linearGradient>
            <path d="M 100 15 L 100 185 M 15 100 L 185 100 M 40 40 L 160 160 M 40 160 L 160 40" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" />
            <!-- Chevrons -->
            <path d="M 85 45 L 100 30 L 115 45 M 85 155 L 100 170 L 115 155 M 45 85 L 30 100 L 45 115 M 155 85 L 170 100 L 155 115" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <polygon points="100,75 118,90 125,100 118,110 100,125 82,110 75,100 82,90" fill="url(#iceCenter)" stroke="#ffffff" stroke-width="3" />
          </svg>
        </div>

        <!-- SHIELDED X CELL -->
        <div class="cell x-cell">
          <div class="shield-aura"></div>
          <span class="shield-tag">SHIELD</span>
          X
        </div>

        <div class="cell"></div>

        <!-- ROW 3 -->
        <div class="cell x-cell">X</div>
        <div class="cell x-cell">X</div>
        <div class="cell o-cell">O</div>
      </div>
    </div>
  </div>
</body>
</html>
