<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XO TACTIX - Fixed Portrait</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Orbitron:wght@700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 800px;
      height: 1200px;
      overflow: hidden;
      background: #080d1a;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 30px 40px;
    }

    /* Outer dark border frame */
    .outer-frame {
      position: absolute;
      inset: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle grid lines */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .glow-top {
      position: absolute;
      top: -120px;
      left: 100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .glow-bottom {
      position: absolute;
      bottom: -120px;
      right: 0px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.15) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* TOP HEADER */
    .top-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 2;
      margin-top: 10px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 20px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.08);
      border: 1.5px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .title-row {
      font-family: 'Fredoka', 'Orbitron', sans-serif;
      font-size: 84px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .title-x {
      color: #00f0ff;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.8), 0 0 50px rgba(0, 240, 255, 0.4);
    }

    .title-o {
      color: #ff2d75;
      text-shadow: 0 0 25px rgba(255, 45, 117, 0.8), 0 0 50px rgba(255, 45, 117, 0.4);
      margin-right: 14px;
    }

    .title-tactix {
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.4));
      letter-spacing: 0.06em;
    }

    .subtitle-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* CENTER BOARD */
    .center-board {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .board-wrapper {
      position: relative;
      transform: rotate(3.2deg);
    }

    .board-container {
      width: 530px;
      height: 530px;
      background: rgba(16, 24, 40, 0.75);
      border: 3px solid rgba(0, 240, 255, 0.28);
      border-radius: 40px;
      padding: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 15px;
      position: relative;
    }

    .grid-cell {
      position: relative;
      background: rgba(22, 32, 54, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .grid-cell.cell-2x {
      border: 2px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
    }

    .cell-2x-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      z-index: 5;
    }

    /* Perfect Centered Marks */
    .mark-x {
      font-family: 'Fredoka', sans-serif;
      font-size: 110px;
      font-weight: 700;
      color: #00f0ff;
      line-height: 1;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .mark-o {
      font-family: 'Fredoka', sans-serif;
      font-size: 110px;
      font-weight: 700;
      color: #ff2d75;
      line-height: 1;
      text-shadow: 0 0 25px rgba(255, 45, 117, 0.9), 0 0 50px rgba(255, 45, 117, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .laser-beam-line {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 630px;
      height: 6px;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.2) 0%, #fbbf24 30%, #fffbeb 50%, #fbbf24 70%, rgba(251, 191, 36, 0.2) 100%);
      box-shadow: 0 0 20px #fbbf24, 0 0 35px rgba(251, 191, 36, 0.7);
      transform: translate(-50%, -50%) rotate(-45deg);
      border-radius: 999px;
      z-index: 8;
      pointer-events: none;
    }

    .laser-star-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .laser-star-svg {
      width: 54px;
      height: 54px;
      filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 25px #fbbf24);
    }

    /* BOTTOM CONTROLS */
    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 2;
      width: 100%;
      margin-bottom: 10px;
    }

    .action-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 28px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.1);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .powers-deck {
      display: flex;
      gap: 16px;
    }

    .power-card {
      width: 72px;
      height: 72px;
      background: rgba(20, 28, 45, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .power-card.border-bomb { border-color: rgba(239, 68, 68, 0.45); }
    .power-card.border-shield { border-color: rgba(6, 182, 212, 0.45); }
    .power-card.border-hole { border-color: rgba(168, 85, 247, 0.45); }
    .power-card.border-vampire { border-color: rgba(244, 63, 94, 0.45); }

    .power-card .p-icon {
      font-size: 28px;
      line-height: 1;
    }

    /* Bottom gradient accent line */
    .bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #00f0ff 0%, #a855f7 50%, #ff2d75 100%);
      box-shadow: 0 -2px 15px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="outer-frame"></div>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>
  <div class="bottom-accent-bar"></div>

  <!-- TOP HEADER -->
  <div class="top-header">
    <div class="badge-pill">
      <span>◆</span> POWER TIC-TAC-TOE
    </div>

    <div class="title-row">
      <span class="title-x">X</span><span class="title-o">O</span>
      <span class="title-tactix">TACTIX</span>
    </div>

    <div class="subtitle-text">
      THINK FAST. STRIKE SMARTER.
    </div>
  </div>

  <!-- CENTER BOARD -->
  <div class="center-board">
    <div class="board-wrapper">
      <div class="board-container">
        <div class="laser-beam-line"></div>
        <div class="laser-star-center">
          <svg class="laser-star-svg" viewBox="0 0 100 100">
            <polygon points="50,0 58,42 100,50 58,58 50,100 42,58 0,50 42,42" fill="#ffffff" />
            <polygon points="50,22 55,45 78,50 55,55 50,78 45,55 22,50 45,45" fill="#fef08a" />
            <circle cx="50" cy="50" r="7" fill="#ffffff" />
          </svg>
        </div>

        <!-- ROW 0 -->
        <div class="grid-cell">
          <div class="mark-x">X</div>
        </div>
        <div class="grid-cell"></div>
        <div class="grid-cell">
          <div class="mark-o">O</div>
        </div>

        <!-- ROW 1 -->
        <div class="grid-cell"></div>
        <div class="grid-cell cell-2x">
          <span class="cell-2x-badge">2x</span>
          <div class="mark-x">X</div>
        </div>
        <div class="grid-cell"></div>

        <!-- ROW 2 -->
        <div class="grid-cell">
          <div class="mark-o">O</div>
        </div>
        <div class="grid-cell"></div>
        <div class="grid-cell">
          <div class="mark-x">X</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM SECTION -->
  <div class="bottom-section">
    <div class="action-badge">
      <span>✦</span> UNLEASH THE GRID
    </div>

    <div class="powers-deck">
      <div class="power-card border-bomb">
        <span class="p-icon">💣</span>
      </div>
      <div class="power-card border-shield">
        <span class="p-icon">🛡️</span>
      </div>
      <div class="power-card border-hole">
        <span class="p-icon">🕳️</span>
      </div>
      <div class="power-card border-vampire">
        <span class="p-icon">🧛</span>
      </div>
    </div>
  </div>
</body>
</html>
