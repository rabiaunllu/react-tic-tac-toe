<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XO TACTIX - Fixed Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Orbitron:wght@700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #080d1a;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer dark border frame like in the Figma export */
    .outer-frame {
      position: absolute;
      inset: 22px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle grid lines */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 54px 54px;
      pointer-events: none;
    }

    /* Ambient background glows matching Figma */
    .glow-corner-topleft {
      position: absolute;
      top: -150px;
      left: 200px;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .glow-corner-bottomright {
      position: absolute;
      bottom: -150px;
      right: 0px;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.15) 0%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
    }

    /* Main Container */
    .container {
      width: 1720px;
      height: 940px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 60px;
      z-index: 2;
    }

    /* Top right label */
    .top-right-tag {
      position: absolute;
      top: 60px;
      right: 70px;
      font-family: 'Orbitron', monospace;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      z-index: 15;
    }

    /* LEFT SIDE: BRANDING */
    .left-side {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-left: 20px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.08);
      border: 1.5px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      width: fit-content;
    }

    .title-row {
      font-family: 'Fredoka', 'Orbitron', sans-serif;
      font-size: 112px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .title-x {
      color: #00f0ff;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.8), 0 0 50px rgba(0, 240, 255, 0.4);
    }

    .title-o {
      color: #ff2d75;
      text-shadow: 0 0 25px rgba(255, 45, 117, 0.8), 0 0 50px rgba(255, 45, 117, 0.4);
      margin-right: 18px;
    }

    .title-tactix {
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.4));
      letter-spacing: 0.06em;
    }

    .slogan-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slogan-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #ffffff;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .slogan-text .highlight {
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
    }

    .slogan-line {
      width: 120px;
      height: 5px;
      background: #00f0ff;
      border-radius: 999px;
      box-shadow: 0 0 15px #00f0ff;
    }

    /* Powers Row */
    .powers-deck {
      display: flex;
      gap: 22px;
      margin-top: 15px;
    }

    .power-card {
      width: 96px;
      height: 110px;
      background: rgba(20, 28, 45, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .power-card.border-bomb { border-color: rgba(239, 68, 68, 0.4); }
    .power-card.border-shield { border-color: rgba(6, 182, 212, 0.4); }
    .power-card.border-hole { border-color: rgba(168, 85, 247, 0.4); }
    .power-card.border-vampire { border-color: rgba(244, 63, 94, 0.4); }

    .power-card .p-icon {
      font-size: 34px;
      line-height: 1;
    }

    .power-card .p-name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    /* RIGHT SIDE: 3x3 TACTICAL BOARD */
    .right-side {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-wrapper {
      position: relative;
      transform: rotate(3.2deg);
    }

    .board-container {
      width: 660px;
      height: 660px;
      background: rgba(16, 24, 40, 0.75);
      border: 3px solid rgba(0, 240, 255, 0.28);
      border-radius: 46px;
      padding: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 18px;
      position: relative;
    }

    .grid-cell {
      position: relative;
      background: rgba(22, 32, 54, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .grid-cell.cell-2x {
      border: 2px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
    }

    .cell-2x-badge {
      position: absolute;
      top: 12px;
      right: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      z-index: 5;
    }

    /* Perfect Centered Marks */
    .mark-x {
      font-family: 'Fredoka', sans-serif;
      font-size: 135px;
      font-weight: 700;
      color: #00f0ff;
      line-height: 1;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.9), 0 0 60px rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .mark-o {
      font-family: 'Fredoka', sans-serif;
      font-size: 135px;
      font-weight: 700;
      color: #ff2d75;
      line-height: 1;
      text-shadow: 0 0 30px rgba(255, 45, 117, 0.9), 0 0 60px rgba(255, 45, 117, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Diagonal Winning Laser Beam */
    .laser-beam-line {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 780px;
      height: 7px;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.2) 0%, #fbbf24 30%, #fffbeb 50%, #fbbf24 70%, rgba(251, 191, 36, 0.2) 100%);
      box-shadow: 0 0 20px #fbbf24, 0 0 40px rgba(251, 191, 36, 0.7);
      transform: translate(-50%, -50%) rotate(-45deg);
      border-radius: 999px;
      z-index: 8;
      pointer-events: none;
    }

    .laser-star-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .laser-star-svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 30px #fbbf24);
    }
  </style>
</head>
<body>
  <div class="outer-frame"></div>
  <div class="top-right-tag">3×3 · POWERS ON</div>
  <div class="glow-corner-topleft"></div>
  <div class="glow-corner-bottomright"></div>

  <div class="container">
    <!-- LEFT SIDE -->
    <div class="left-side">
      <div class="badge-pill">
        <span>◆</span> TACTICAL ARENA · POWERED UP
      </div>

      <div class="title-row">
        <span class="title-x">X</span><span class="title-o">O</span>
        <span class="title-tactix">TACTIX</span>
      </div>

      <div class="slogan-box">
        <div class="slogan-text">
          EVERY SQUARE CAN <span class="highlight">CHANGE THE BATTLE.</span>
        </div>
        <div class="slogan-line"></div>
      </div>

      <div class="powers-deck">
        <div class="power-card border-bomb">
          <span class="p-icon">💣</span>
          <span class="p-name">BOMB</span>
        </div>
        <div class="power-card border-shield">
          <span class="p-icon">🛡️</span>
          <span class="p-name">SHIELD</span>
        </div>
        <div class="power-card border-hole">
          <span class="p-icon">🕳️</span>
          <span class="p-name">BLACK HOLE</span>
        </div>
        <div class="power-card border-vampire">
          <span class="p-icon">🧛</span>
          <span class="p-name">VAMPIRE</span>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">
      <div class="board-wrapper">
        <div class="board-container">
          <div class="laser-beam-line"></div>
          <div class="laser-star-center">
            <svg class="laser-star-svg" viewBox="0 0 100 100">
              <polygon points="50,0 58,42 100,50 58,58 50,100 42,58 0,50 42,42" fill="#ffffff" />
              <polygon points="50,22 55,45 78,50 55,55 50,78 45,55 22,50 45,45" fill="#fef08a" />
              <circle cx="50" cy="50" r="7" fill="#ffffff" />
            </svg>
          </div>

          <!-- ROW 0 -->
          <div class="grid-cell">
            <div class="mark-x">X</div>
          </div>
          <div class="grid-cell"></div>
          <div class="grid-cell">
            <div class="mark-o">O</div>
          </div>

          <!-- ROW 1 -->
          <div class="grid-cell"></div>
          <div class="grid-cell cell-2x">
            <span class="cell-2x-badge">2x</span>
            <div class="mark-x">X</div>
          </div>
          <div class="grid-cell"></div>

          <!-- ROW 2 -->
          <div class="grid-cell">
            <div class="mark-o">O</div>
          </div>
          <div class="grid-cell"></div>
          <div class="grid-cell">
            <div class="mark-x">X</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
